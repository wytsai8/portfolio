<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Biomarker Discovery | Project Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            color: #4a4a4a;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { font-family: 'Montserrat', sans-serif; color: #333; margin-bottom: 10px; }
        .back-btn {
            display: inline-block; margin-bottom: 30px; text-decoration: none; color: #3a7a6a; font-weight: 600; transition: color 0.3s;
        }
        .back-btn:hover { color: #222; }
        
        .dashboard-container {
            margin-top: 40px;
            background: #fafbfc;
            border: 1px solid #eef0f5;
            border-radius: 20px;
            padding: 30px;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .custom-select {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            width: 100%;
            font-size: 0.95rem;
        }
        .plots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 1000px) { .plots-grid { grid-template-columns: 1fr; } }
        
        .plot-card {
            background: white;
            border-radius: 15px;
            border: 1px solid #eee;
            padding: 15px;
            min-height: 420px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .plot-container { width: 100%; height: 380px; }
        
        .status-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 5; border-radius: 15px;
            flex-direction: column; text-align: center; padding: 20px;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3;
            border-top: 4px solid #3a7a6a; border-radius: 50%;
            animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html#works" class="back-btn">← Back to Portfolio</a>
        <h1>Novel Biomarker Discovery for Alzheimer's Disease</h1>
        
        <div style="text-align: center; margin: 30px 0;">
            <img src="AD.png" alt="AD Analysis" style="width: 100%; max-width: 1000px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        </div>

        <div class="dashboard-container">
            <div class="controls-grid">
                <div>
                    <label style="font-size: 0.8rem; font-weight: 700; color: #666; display: block; margin-bottom: 5px;">TISSUE</label>
                    <select id="sel-tissue" class="custom-select" onchange="updatePlots()">
                        <option value="Brain">Brain Tissue</option>
                        <option value="CSF">CSF</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.8rem; font-weight: 700; color: #666; display: block; margin-bottom: 5px;">PLATFORM</label>
                    <select id="sel-platform" class="custom-select" onchange="updatePlots()">
                        <option value="TMT">TMT</option>
                        <option value="LFQ">LFQ</option>
                        <option value="PEA">PEA</option>
                    </select>
                </div>
                <div>
                    <label style="font-size: 0.8rem; font-weight: 700; color: #666; display: block; margin-bottom: 5px;">MODEL</label>
                    <select id="sel-model" class="custom-select" onchange="updatePlots()">
                        <option value="RF">Random Forest</option>
                        <option value="LR">Logistic Regression</option>
                    </select>
                </div>
            </div>

            <div class="plots-grid">
                <div class="plot-card">
                    <div id="status-shap" class="status-overlay"><div class="spinner"></div><div id="msg-shap">Loading...</div></div>
                    <div id="plot-shap" class="plot-container"></div>
                </div>
                <div class="plot-card">
                    <div id="status-volcano" class="status-overlay"><div class="spinner"></div><div id="msg-volcano">Loading...</div></div>
                    <div id="plot-volcano" class="plot-container"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updatePlots() {
            const tissue = document.getElementById('sel-tissue').value;
            const platform = document.getElementById('sel-platform').value;
            
            const sShap = document.getElementById('status-shap');
            const sVol = document.getElementById('status-volcano');
            const mShap = document.getElementById('msg-shap');
            const mVol = document.getElementById('msg-volcano');

            sShap.style.display = 'flex'; sVol.style.display = 'flex';
            mShap.innerText = "Loading data..."; mVol.innerText = "Loading data...";

            try {
                if (tissue !== 'Brain' || platform !== 'TMT') {
                    throw new Error("Detailed results for this combination are coming soon. Select Brain + TMT for the live demo.");
                }

                const [resTMT, resSHAP] = await Promise.all([
                    fetch('TMT_brain.txt'),
                    fetch('SHAP_TMT_brain.txt')
                ]);

                if (!resTMT.ok || !resSHAP.ok) throw new Error("Data files missing on server.");

                const txtTMT = await resTMT.text();
                const txtSHAP = await resSHAP.text();

                // Colors
                const cUp = '#d32f2f'; const cDown = '#388e3c'; const cNS = '#bdbdbd';

                // --- 1. Parse TMT (Volcano) ---
                const linesTMT = txtTMT.split(/\r?\n/).filter(l => l.trim());
                const headTMT = linesTMT[0].split('\t');
                const gIdx = headTMT.findIndex(h => h.toLowerCase().includes('gene'));
                const uIdx = headTMT.findIndex(h => h.toLowerCase().includes('uniprot'));
                const lIdx = headTMT.findIndex(h => h.toLowerCase().includes('logfc'));
                const pIdx = headTMT.findIndex(h => h.toLowerCase().includes('p.value') || h.toLowerCase().includes('pvalue'));

                let vData = []; let u2g = {}; let g2c = {};
                for (let i = 1; i < linesTMT.length; i++) {
                    const c = linesTMT[i].split('\t');
                    const gene = c[gIdx]?.trim() || "Unknown";
                    const uni = c[uIdx]?.trim() || "";
                    const fc = parseFloat(c[lIdx]);
                    const p = parseFloat(c[pIdx]);
                    if (!isNaN(fc) && !isNaN(p)) {
                        let color = cNS;
                        if (-Math.log10(p) > 1.3) {
                            if (fc > 0.1) color = cUp;
                            else if (fc < -0.1) color = cDown;
                        }
                        vData.push({ gene, fc, lp: -Math.log10(p), color });
                        if (uni) u2g[uni] = gene;
                        g2c[gene] = color;
                    }
                }

                // --- 2. Parse SHAP ---
                const linesSHAP = txtSHAP.split(/\r?\n/).filter(l => l.trim());
                // Detection: if first cell is empty, first row is headers with leading tab
                const rawHeadSHAP = linesSHAP[0].split('\t');
                const hasLeadingTab = rawHeadSHAP[0] === "";
                const headers = hasLeadingTab ? rawHeadSHAP.slice(1) : rawHeadSHAP;

                let sums = new Array(headers.length).fill(0);
                let rowCount = 0;
                for (let i = 1; i < linesSHAP.length; i++) {
                    const c = linesSHAP[i].split('\t');
                    // Data rows usually have index in first col
                    const vals = c.slice(1); 
                    if (vals.length >= headers.length) {
                        for (let j = 0; j < headers.length; j++) {
                            sums[j] += Math.abs(parseFloat(vals[j]) || 0);
                        }
                        rowCount++;
                    }
                }

                let finalShap = headers.map((uni, j) => {
                    const gene = u2g[uni.trim()] || uni.trim();
                    return { gene, val: sums[j] / rowCount, color: g2c[gene] || cNS };
                }).sort((a, b) => b.val - a.val);

                // --- 3. Render ---
                const top15 = finalShap.slice(0, 15);
                
                Plotly.newPlot('plot-shap', [{
                    x: top15.map(d => d.val).reverse(),
                    y: top15.map(d => d.gene).reverse(),
                    type: 'bar', orientation: 'h',
                    marker: { color: top15.map(d => d.color).reverse() },
                    hovertemplate: '<b>%{y}</b><extra></extra>'
                }], {
                    title: { text: 'Overall Feature Importance Based on SHAP Values', font: {size: 12} },
                    margin: { l: 80, r: 20, t: 40, b: 40 },
                    xaxis: { title: 'mean(|SHAP value|)', tickformat: '.3f' },
                    yaxis: { automargin: true },
                    plot_bgcolor: 'white'
                }, {displayModeBar: false});

                Plotly.newPlot('plot-volcano', [{
                    x: vData.map(d => d.fc), y: vData.map(d => d.lp),
                    text: vData.map(d => d.gene), mode: 'markers',
                    marker: { color: vData.map(d => d.color), size: 6, opacity: 0.8 },
                    hovertemplate: '<b>%{text}</b><br>Log2FC: %{x:.2f}<br>-Log10 P: %{y:.2f}<extra></extra>'
                }], {
                    title: { text: 'Volcano Plot: Brain TMT', font: {size: 13} },
                    xaxis: { title: 'Log2 Fold Change', zeroline: true },
                    yaxis: { title: '-Log10 p-value' },
                    margin: { l: 50, r: 20, t: 40, b: 40 },
                    hovermode: 'closest'
                }, {displayModeBar: false});

                // Interaction
                document.getElementById('plot-shap').on('plotly_click', (data) => {
                    const gene = data.points[0].y;
                    const d = vData.find(v => v.gene === gene);
                    if (d) {
                        Plotly.relayout('plot-volcano', {
                            annotations: [{
                                x: d.fc, y: d.lp, xref: 'x', yref: 'y', text: `<b>${d.gene}</b>`,
                                showarrow: true, arrowhead: 2, ax: 40, ay: -40,
                                font: { color: '#fff' }, bgcolor: '#333', borderpad: 4
                            }]
                        });
                    }
                });

                sShap.style.display = 'none'; sVol.style.display = 'none';

            } catch (err) {
                console.error(err);
                mShap.innerHTML = `<span style="color:#d9534f">Error: ${err.message}</span>`;
                mVol.innerHTML = `<span style="color:#d9534f">Check Console for details</span>`;
                document.querySelectorAll('.spinner').forEach(s => s.style.display = 'none');
            }
        }
        window.onload = updatePlots;
    </script>
</body>
</html>
