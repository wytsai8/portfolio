<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Biomarker Discovery | Project Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            color: #4a4a4a;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { font-family: 'Montserrat', sans-serif; color: #333; margin-bottom: 10px; }
        .back-btn {
            display: inline-block; margin-bottom: 30px; text-decoration: none; color: #3a7a6a; font-weight: 600; transition: color 0.3s;
        }
        .back-btn:hover { color: #222; }
        .interactive-area {
            width: 100%;
            height: auto;
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        /* --- Dashboard Styles --- */
        .dashboard-container {
            margin-top: 60px;
            background: #fafbfc;
            border: 1px solid #eef0f5;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        .dashboard-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .custom-select {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: white;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }
        .custom-select:focus {
            border-color: #b5ead7;
            box-shadow: 0 0 0 3px rgba(181, 234, 215, 0.3);
        }
        .plots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 900px) {
            .plots-grid { grid-template-columns: 1fr; }
        }
        .plot-card {
            background: white;
            border-radius: 15px;
            border: 1px solid #eee;
            padding: 20px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .plot-container {
            width: 100%;
            height: 380px;
        }
        .loading-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            border-radius: 15px;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3a7a6a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .error-message {
            padding: 20px;
            color: #d9534f;
            text-align: center;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html#works" class="back-btn">← Back to Portfolio</a>
        <h1>Novel Biomarker Discovery for Alzheimer's Disease</h1>
        <p>A cross-platform study integrating brain and CSF proteomes to identify stable biomarker panels for early diagnosis.</p>
        
        <div class="interactive-area">
            <img src="AD.png" alt="Alzheimer's Biomarker Analysis" style="width: 100%; height: auto; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.08);">
        </div>

        <div class="dashboard-container">
            <h2 class="dashboard-title">Interactive Model Explorer</h2>
            
            <div class="controls-grid">
                <div class="control-group">
                    <label class="control-label">Tissue Source</label>
                    <select id="sel-tissue" class="custom-select" onchange="updatePlots()">
                        <option value="Brain">Brain Tissue</option>
                        <option value="CSF">Cerebrospinal Fluid (CSF)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Proteomics Platform</label>
                    <select id="sel-platform" class="custom-select" onchange="updatePlots()">
                        <option value="TMT">TMT (Tandem Mass Tag)</option>
                        <option value="LFQ">LFQ (Label-Free Quantitation)</option>
                        <option value="PEA">PEA (Proximity Extension Assay)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Machine Learning Model</label>
                    <select id="sel-model" class="custom-select" onchange="updatePlots()">
                        <option value="RF">Random Forest (RF)</option>
                        <option value="LR">Logistic Regression (LR)</option>
                    </select>
                </div>
            </div>

            <div class="plots-grid">
                <!-- SHAP Plot Area -->
                <div class="plot-card" id="card-shap">
                    <div class="loading-overlay" id="loader-shap"><div class="loading-spinner"></div></div>
                    <div id="plotly-shap" class="plot-container"></div>
                    <div id="err-shap" class="error-message" style="display:none;"></div>
                </div>

                <!-- Volcano Plot Area -->
                <div class="plot-card" id="card-volcano">
                    <div class="loading-overlay" id="loader-volcano"><div class="loading-spinner"></div></div>
                    <div id="plotly-volcano" class="plot-container"></div>
                    <div id="err-volcano" class="error-message" style="display:none;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updatePlots() {
            const tissue = document.getElementById('sel-tissue').value;
            const platform = document.getElementById('sel-platform').value;
            const model = document.getElementById('sel-model').value;
            
            const loaderShap = document.getElementById('loader-shap');
            const loaderVolcano = document.getElementById('loader-volcano');
            const errShap = document.getElementById('err-shap');
            const errVolcano = document.getElementById('err-volcano');
            const plotShap = document.getElementById('plotly-shap');
            const plotVolcano = document.getElementById('plotly-volcano');

            // Reset UI
            loaderShap.style.display = 'flex';
            loaderVolcano.style.display = 'flex';
            errShap.style.display = 'none';
            errVolcano.style.display = 'none';
            plotShap.style.visibility = 'hidden';
            plotVolcano.style.visibility = 'hidden';

            try {
                if (tissue !== 'Brain' || platform !== 'TMT') {
                    throw new Error(`Data for ${tissue} ${platform} is currently being processed. Please select Brain + TMT to see real results.`);
                }

                // Fetch Files
                const [resTMT, resSHAP] = await Promise.all([
                    fetch('TMT_brain.txt').catch(() => null),
                    fetch('SHAP_TMT_brain.txt').catch(() => null)
                ]);

                if (!resTMT || !resTMT.ok) throw new Error("Could not find 'TMT_brain.txt'. Please ensure it's uploaded to your GitHub repository.");
                if (!resSHAP || !resSHAP.ok) throw new Error("Could not find 'SHAP_TMT_brain.txt'. Please ensure it's uploaded to your GitHub repository.");

                const dataTMT = await resTMT.text();
                const dataSHAP = await resSHAP.text();

                // Darker Volcano Colors
                const colorUp = '#cc3300';    // Deep Red
                const colorDown = '#1b5e20';  // Deep Green
                const colorNS = '#b0b0b0';    // Solid Grey

                // 1. Parse Volcano Data (TMT_brain.txt)
                const rowsTMT = dataTMT.split(/\r?\n/).filter(r => r.trim());
                const headersTMT = rowsTMT[0].split('\t');
                const gIdx = headersTMT.findIndex(h => h.trim().toLowerCase().includes('gene'));
                const uIdx = headersTMT.findIndex(h => h.trim().toLowerCase().includes('uniprot'));
                const lIdx = headersTMT.findIndex(h => h.trim().toLowerCase().includes('logfc'));
                const pIdx = headersTMT.findIndex(h => h.trim().toLowerCase().includes('p.value') || h.trim().toLowerCase().includes('pvalue'));

                let volcanoData = [];
                let uniprotToGene = {};
                let geneToColor = {};

                for (let i = 1; i < rowsTMT.length; i++) {
                    const cols = rowsTMT[i].split('\t');
                    if (cols.length > 3) {
                        const gene = cols[gIdx] ? cols[gIdx].trim() : "Unknown";
                        const uniprot = cols[uIdx] ? cols[uIdx].trim() : "";
                        const logFC = parseFloat(cols[lIdx]);
                        const pValue = parseFloat(cols[pIdx]);

                        if (!isNaN(logFC) && !isNaN(pValue) && pValue > 0) {
                            const negLogP = -Math.log10(pValue);
                            let color = colorNS;
                            if (negLogP > 1.3 && logFC > 0.1) color = colorUp;
                            else if (negLogP > 1.3 && logFC < -0.1) color = colorDown;
                            
                            volcanoData.push({ gene, logFC, negLogP, color });
                            if (uniprot) uniprotToGene[uniprot] = gene;
                            geneToColor[gene] = color;
                        }
                    }
                }

                // 2. Parse SHAP Data (SHAP_TMT_brain.txt)
                const rowsSHAP = dataSHAP.split(/\r?\n/).filter(r => r.trim());
                const headersSHAP = rowsSHAP[0].split('\t').slice(1); // skip index column

                let shapSums = new Array(headersSHAP.length).fill(0);
                let count = 0;
                for (let i = 1; i < rowsSHAP.length; i++) {
                    const cols = rowsSHAP[i].split('\t').slice(1);
                    if (cols.length === headersSHAP.length) {
                        for (let j = 0; j < cols.length; j++) {
                            shapSums[j] += Math.abs(parseFloat(cols[j]) || 0);
                        }
                        count++;
                    }
                }

                let shapFeatures = [];
                for (let j = 0; j < headersSHAP.length; j++) {
                    const uni = headersSHAP[j].trim();
                    const gene = uniprotToGene[uni] || uni;
                    shapFeatures.push({
                        gene: gene,
                        meanShap: shapSums[j] / count,
                        color: geneToColor[gene] || colorNS
                    });
                }
                shapFeatures.sort((a, b) => b.meanShap - a.meanShap);

                // 3. Render Bar Plot
                const top15 = shapFeatures.slice(0, 15);
                const barY = top15.map(d => d.gene).reverse();
                const barX = top15.map(d => d.meanShap).reverse();
                const barC = top15.map(d => d.color).reverse();

                const barTrace = {
                    x: barX, y: barY, type: 'bar', orientation: 'h',
                    marker: { color: barC },
                    hovertemplate: '<b>%{y}</b><extra></extra>' // Remove mean value display
                };
                const barLayout = {
                    title: { text: 'Overall Feature Importance Based on SHAP Values', font: {size: 13, color: '#333'} },
                    margin: { l: 90, r: 20, t: 40, b: 60 },
                    xaxis: { title: 'mean(|SHAP value|)', tickformat: '.3f' },
                    yaxis: { title: '' },
                    plot_bgcolor: 'white'
                };
                Plotly.newPlot('plotly-shap', [barTrace], barLayout, {displayModeBar: false});

                // 4. Render Volcano Plot
                const volTrace = {
                    x: volcanoData.map(d => d.logFC),
                    y: volcanoData.map(d => d.negLogP),
                    text: volcanoData.map(d => d.gene),
                    mode: 'markers', type: 'scatter',
                    marker: { color: volcanoData.map(d => d.color), size: 6, opacity: 0.8 },
                    hovertemplate: '<b>%{text}</b><br>Log2FC: %{x:.2f}<br>-Log10 P: %{y:.2f}<extra></extra>'
                };
                const volLayout = {
                    title: { text: 'Volcano Plot: Brain TMT', font: {size: 14, color: '#333'} },
                    xaxis: { title: 'Log2 Fold Change', zeroline: true, zerolinecolor: '#999' },
                    yaxis: { title: '-Log10 p-value' },
                    margin: { l: 50, r: 20, t: 40, b: 40 },
                    hovermode: 'closest'
                };
                Plotly.newPlot('plotly-volcano', [volTrace], volLayout, {displayModeBar: false});

                // 5. Interactivity: Click Bar -> Highlight Volcano
                plotShap.on('plotly_click', function(data) {
                    const clickedGene = data.points[0].y;
                    const d = volcanoData.find(v => v.gene === clickedGene);
                    if (d) {
                        Plotly.relayout('plotly-volcano', {
                            annotations: [{
                                x: d.logFC, y: d.negLogP, xref: 'x', yref: 'y',
                                text: `<b>${d.gene}</b>`,
                                showarrow: true, arrowhead: 2, ax: 40, ay: -40,
                                font: { size: 14, color: '#fff' }, bgcolor: '#333', borderpad: 4
                            }]
                        });
                    }
                });

                // Finalize UI
                loaderShap.style.display = 'none';
                loaderVolcano.style.display = 'none';
                plotShap.style.visibility = 'visible';
                plotVolcano.style.visibility = 'visible';

            } catch (err) {
                console.error(err);
                loaderShap.style.display = 'none';
                loaderVolcano.style.display = 'none';
                errShap.style.display = 'block';
                errVolcano.style.display = 'block';
                errShap.innerHTML = `<strong>Error:</strong> ${err.message}`;
                errVolcano.innerHTML = `<strong>Error:</strong> Failed to render visualization.`;
            }
        }
        window.onload = updatePlots;
    </script>
</body>
</html>
