<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novel Biomarker Discovery | Project Detail</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
            color: #4a4a4a;
            margin: 0;
            padding: 40px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 { font-family: 'Montserrat', sans-serif; color: #333; margin-bottom: 10px; }
        .back-btn {
            display: inline-block; margin-bottom: 30px; text-decoration: none; color: #3a7a6a; font-weight: 600; transition: color 0.3s;
        }
        .back-btn:hover { color: #222; }
        .interactive-area {
            width: 100%;
            height: 600px;
            background: #f0f2f8;
            border: 2px dashed #c7ceea;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a6496;
            font-weight: 600;
            margin-top: 30px;
        }

        /* --- Dashboard Styles --- */
        .dashboard-container {
            margin-top: 60px;
            background: #fafbfc;
            border: 1px solid #eef0f5;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
        }
        .dashboard-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
        }
        .controls-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .custom-select {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background: white;
            font-size: 1rem;
            color: #333;
            cursor: pointer;
            outline: none;
            transition: all 0.3s;
        }
        .custom-select:focus {
            border-color: #b5ead7;
            box-shadow: 0 0 0 3px rgba(181, 234, 215, 0.3);
        }
        .plots-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        @media (max-width: 768px) {
            .plots-grid { grid-template-columns: 1fr; }
        }
        .plot-card {
            background: white;
            border-radius: 15px;
            border: 1px solid #eee;
            padding: 30px 20px;
            height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            transition: all 0.3s ease;
        }
        .plot-title {
            font-weight: 700;
            color: #444;
            margin-bottom: 10px;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3a7a6a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            margin-bottom: 15px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html#works" class="back-btn">← Back to Portfolio</a>
        <h1>Novel Biomarker Discovery for Alzheimer's Disease</h1>
        <p>A cross-platform study integrating brain and CSF proteomes to identify stable biomarker panels for early diagnosis.</p>
        
        <div class="interactive-area" style="background: none; border: none; height: auto;">
            <img src="AD.png" alt="Alzheimer's Biomarker Analysis" style="width: 100%; height: auto; border-radius: 15px; box-shadow: 0 15px 40px rgba(0,0,0,0.08); transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
        </div>

        <!-- Interactive Dashboard Prototype -->
        <div class="dashboard-container">
            <h2 class="dashboard-title">Interactive Model Explorer</h2>
            
            <div class="controls-grid">
                <div class="control-group">
                    <label class="control-label">Tissue Source</label>
                    <select id="sel-tissue" class="custom-select" onchange="updatePlots()">
                        <option value="Brain">Brain Tissue</option>
                        <option value="CSF">Cerebrospinal Fluid (CSF)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Proteomics Platform</label>
                    <select id="sel-platform" class="custom-select" onchange="updatePlots()">
                        <option value="TMT">TMT (Tandem Mass Tag)</option>
                        <option value="LFQ">LFQ (Label-Free Quantitation)</option>
                        <option value="PEA">PEA (Proximity Extension Assay)</option>
                    </select>
                </div>
                <div class="control-group">
                    <label class="control-label">Machine Learning Model</label>
                    <select id="sel-model" class="custom-select" onchange="updatePlots()">
                        <option value="RF">Random Forest (RF)</option>
                        <option value="LR">Logistic Regression (LR)</option>
                    </select>
                </div>
            </div>

            <div class="plots-grid">
                <!-- SHAP Plot Area -->
                <div class="plot-card" id="card-shap">
                    <div class="loading-spinner" id="spin-shap"></div>
                    <div id="content-shap" style="width: 100%;">
                        <div id="plotly-shap" style="width: 100%; height: 350px;"></div>
                    </div>
                </div>

                <!-- Volcano Plot Area -->
                <div class="plot-card" id="card-volcano">
                    <div class="loading-spinner" id="spin-volcano"></div>
                    <div id="content-volcano" style="width: 100%;">
                        <div id="plotly-volcano" style="width: 100%; height: 350px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function updatePlots() {
            const tissue = document.getElementById('sel-tissue').value;
            const platform = document.getElementById('sel-platform').value;
            const model = document.getElementById('sel-model').value;
            
            const shapCard = document.getElementById('content-shap');
            const volcanoCard = document.getElementById('content-volcano');
            const spinShap = document.getElementById('spin-shap');
            const spinVolcano = document.getElementById('spin-volcano');

            shapCard.style.display = 'none';
            volcanoCard.style.display = 'none';
            spinShap.style.display = 'block';
            spinVolcano.style.display = 'block';

            try {
                if (tissue === 'Brain' && platform === 'TMT') {
                    const [resTMT, resSHAP] = await Promise.all([
                        fetch('TMT_brain.txt'),
                        fetch('SHAP_TMT_brain.txt')
                    ]);
                    
                    if (!resTMT.ok || !resSHAP.ok) throw new Error("Could not load data files.");
                    
                    const dataTMT = await resTMT.text();
                    const dataSHAP = await resSHAP.text();
                    
                    // Volcano Colors (Darker versions)
                    const colorUp = '#d9534f'; 
                    const colorDown = '#2e7d32'; 
                    const colorNS = '#cccccc';

                    const rowsTMT = dataTMT.split(/\r?\n/).filter(row => row.trim().length > 0);
                    const headersTMT = rowsTMT[0].split('\t');
                    const gIdx = headersTMT.findIndex(h => h.trim().toLowerCase() === 'gene name' || h.trim().toLowerCase() === 'gene');
                    const uIdx = headersTMT.findIndex(h => h.trim().toLowerCase() === 'uniprot id' || h.trim().toLowerCase() === 'uniprot');
                    const lIdx = headersTMT.findIndex(h => h.trim().toLowerCase() === 'logfc' || h.trim().toLowerCase() === 'log2fc');
                    const pIdx = headersTMT.findIndex(h => h.trim().toLowerCase() === 'p.value' || h.trim().toLowerCase() === 'pvalue');

                    let volcanoData = [];
                    let uniprotToGene = {};
                    let geneToColor = {};
                    
                    for (let i = 1; i < rowsTMT.length; i++) {
                        const cols = rowsTMT[i].split('\t');
                        if (cols.length > Math.max(lIdx, pIdx)) {
                            const gene = cols[gIdx].trim();
                            const uniprot = cols[uIdx].trim();
                            const logFC = parseFloat(cols[lIdx]);
                            const pValue = parseFloat(cols[pIdx]);
                            
                            if (!isNaN(logFC) && !isNaN(pValue) && pValue > 0 && pValue <= 1) {
                                const negLogP = -Math.log10(pValue);
                                let color = colorNS;
                                if (negLogP > 1.3 && logFC > 0.1) color = colorUp;
                                else if (negLogP > 1.3 && logFC < -0.1) color = colorDown;
                                
                                volcanoData.push({ gene, logFC, negLogP, color });
                                if (uniprot) uniprotToGene[uniprot] = gene;
                                geneToColor[gene] = color;
                            }
                        }
                    }

                    const rowsSHAP = dataSHAP.split(/\r?\n/).filter(row => row.trim().length > 0);
                    const headersSHAP = rowsSHAP[0].split('\t').slice(1);

                    let shapSums = new Array(headersSHAP.length).fill(0);
                    let rowCount = 0;
                    for (let i = 1; i < rowsSHAP.length; i++) {
                        const cols = rowsSHAP[i].split('\t').slice(1);
                        if (cols.length === headersSHAP.length) {
                            for (let j = 0; j < cols.length; j++) {
                                shapSums[j] += Math.abs(parseFloat(cols[j]));
                            }
                            rowCount++;
                        }
                    }

                    let shapFeatures = [];
                    for (let j = 0; j < headersSHAP.length; j++) {
                        let uniprot = headersSHAP[j].trim();
                        let gene = uniprotToGene[uniprot] || uniprot; 
                        shapFeatures.push({
                            gene: gene,
                            meanShap: shapSums[j] / rowCount,
                            color: geneToColor[gene] || colorNS
                        });
                    }
                    shapFeatures.sort((a, b) => b.meanShap - a.meanShap);

                    spinShap.style.display = 'none';
                    spinVolcano.style.display = 'none';
                    shapCard.style.display = 'block';
                    volcanoCard.style.display = 'block';

                    const topGenes = shapFeatures.slice(0, 15);
                    const barY_genes = topGenes.map(d => d.gene).reverse();
                    const barX_vals = topGenes.map(d => d.meanShap).reverse();
                    const barColors = topGenes.map(d => d.color).reverse();
                    
                    const barTrace = {
                        x: barX_vals,
                        y: barY_genes,
                        type: 'bar',
                        orientation: 'h',
                        marker: { color: barColors },
                        hovertemplate: '<b>%{y}</b><extra></extra>'
                    };
                    const barLayout = {
                        title: { text: 'Overall Feature Importance Based on SHAP Values', font: {size: 12, color: '#333'} },
                        margin: { l: 80, r: 20, t: 40, b: 60 },
                        xaxis: { title: 'mean(|SHAP value|)', zeroline: false, tickformat: '.3f' },
                        yaxis: { title: '' },
                        plot_bgcolor: 'white'
                    };
                    Plotly.newPlot('plotly-shap', [barTrace], barLayout, {displayModeBar: false});

                    const vX = volcanoData.map(d => d.logFC);
                    const vY = volcanoData.map(d => d.negLogP);
                    const vText = volcanoData.map(d => d.gene);
                    const vColor = volcanoData.map(d => d.color);

                    const volTrace = {
                        x: vX,
                        y: vY,
                        text: vText,
                        mode: 'markers',
                        type: 'scatter',
                        marker: { color: vColor, size: 6, opacity: 0.8 },
                        hovertemplate: '<b>%{text}</b><br>Log2FC: %{x:.2f}<br>-Log10 P: %{y:.2f}<extra></extra>'
                    };
                    const volLayout = {
                        title: { text: `Volcano Plot: Brain TMT`, font: {size: 14, color: '#333'} },
                        xaxis: { title: 'Log2 Fold Change', zeroline: true },
                        yaxis: { title: '-Log10 p-value' },
                        margin: { l: 50, r: 20, t: 40, b: 40 },
                        hovermode: 'closest'
                    };
                    Plotly.newPlot('plotly-volcano', [volTrace], volLayout, {displayModeBar: false});

                    document.getElementById('plotly-shap').on('plotly_click', function(data) {
                        const clickedGene = data.points[0].y; 
                        const geneData = volcanoData.find(d => d.gene === clickedGene);
                        if (geneData) {
                            const updateLayout = {
                                annotations: [{
                                    x: geneData.logFC, y: geneData.negLogP, xref: 'x', yref: 'y',
                                    text: `<b>${geneData.gene}</b>`,
                                    showarrow: true, arrowhead: 2, arrowsize: 1, arrowwidth: 2, arrowcolor: '#333',
                                    ax: geneData.logFC > 0 ? 40 : -40, ay: -40,
                                    font: { size: 14, color: '#fff' }, bgcolor: '#333',
                                    borderpad: 4, opacity: 0.9
                                }]
                            };
                            Plotly.relayout('plotly-volcano', updateLayout);
                        }
                    });

                } else {
                    setTimeout(() => {
                        spinShap.style.display = 'none'; spinVolcano.style.display = 'none';
                        shapCard.style.display = 'block'; volcanoCard.style.display = 'block';
                        shapCard.innerHTML = `<div style="padding: 20px; color: #b85c5c;">⚠️ No real dataset provided for ${tissue} + ${platform}.</div>`;
                        volcanoCard.innerHTML = `<div style="padding: 20px; color: #b85c5c;">⚠️ No real dataset provided for ${tissue} + ${platform}.</div>`;
                    }, 600);
                }
            } catch (err) {
                spinShap.style.display = 'none'; spinVolcano.style.display = 'none';
                shapCard.style.display = 'block'; volcanoCard.style.display = 'block';
                shapCard.innerHTML = `<div style="padding: 20px; color: #d9534f; text-align: center;">Error loading data.<br>Ensure files are on GitHub.</div>`;
                volcanoCard.innerHTML = `<div style="padding: 20px; color: #d9534f; text-align: center;">Error loading data.</div>`;
            }
        }
        window.onload = updatePlots;
    </script>
</body>
</html>
